name: Test Render Live Hub

on:
  workflow_dispatch:

jobs:
  test_hub:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Logs and Check Xxxcalibur
        run: |
          echo "=== 1. Fetching Server Logs ==="
          curl -sS -m 25 "https://openearn-sniper.onrender.com/logs" -o server.log
          echo "Server log size: $(wc -c < server.log) bytes"
          tail -n 120 server.log || true

          echo "=== 2. Check PacoCash Summary ==="
          curl -sS -m 25 "https://openearn-sniper.onrender.com/api/pacocash" -o paco.json || true
          cat paco.json | jq . || true
