name: Test Render Live Hub

on:
  workflow_dispatch:

jobs:
  test_hub:
    runs-on: ubuntu-latest
    steps:
      - name: Query Render Dashboard JSON
        run: |
          echo "=== Testing Render Hub from Europe Runner ==="
          curl -sS --retry 3 --retry-delay 5 -m 30 "https://openearn-sniper.onrender.com/?format=json" -o render_resp.json || true
          if [ -s render_resp.json ]; then
            cat render_resp.json | jq .
          else
            echo "Failed or empty response from Render"
          fi
