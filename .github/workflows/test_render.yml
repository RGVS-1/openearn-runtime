name: Test Render Live Hub

on:
  workflow_dispatch:

jobs:
  test_hub:
    runs-on: ubuntu-latest
    steps:
      - name: Query Render Dashboard HTML
        run: |
          echo "=== Fetching Live HTML Dashboard ==="
          curl -sS -m 25 "https://openearn-sniper.onrender.com/" -o dashboard.html
          echo "HTML size: $(wc -c < dashboard.html) bytes"
          grep -o "Время (МСК):.*" dashboard.html || true
          grep -o "Статус и расписание всех модулей.*" dashboard.html || true
          grep -o "CH-L3WLO53V" dashboard.html || true
          grep -o "v_XQdbRHQUWdlI" dashboard.html || true
